<!DOCTYPE html>
<html lang="hu" xmlns="http://www.w3.org/1999/xhtml" xml:lang="hu" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Bejelentkezés:</title>
   	<link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <center>
    <h1>Bejelentkezés</h1>
    <p th:if="${loginError}" class="error">A felhasználónév nem található az adatbázisban!</p>

    <form th:action="@{/register.html}" method="post">
      <input type="text" id="username" name="username" autofocus="autofocus" placeholder="Felhasználónév" /> <br />
      <input type="password" id="password" name="password" placeholder="Jelszó"/> <br />
      <input type="submit" value="Bejelentkezés" />
      <input type="submit" value="Regisztráció" />
    </form>
  </center>
  </body>
</html>
